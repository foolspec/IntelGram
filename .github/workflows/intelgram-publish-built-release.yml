name: Publish Completed IntelGram Build

on:
  workflow_dispatch:
    inputs:
      macos_run_id:
        description: Successful macOS IntelGram build run ID
        required: true
      windows_run_id:
        description: Successful Windows IntelGram build run ID
        required: true
      linux_run_id:
        description: Successful Linux IntelGram build run ID
        required: true
      release_tag:
        description: New permanent release tag
        required: true
      release_name:
        description: Short feature title shown after the IntelGram version
        required: true
      release_version:
        description: Optional product version such as v18; leave empty to use the next sequential version
        required: false
        default: ""

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish completed build artifacts
    runs-on: ubuntu-24.04
    env:
      MACOS_RUN_ID: ${{ inputs.macos_run_id }}
      WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
      LINUX_RUN_ID: ${{ inputs.linux_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_NAME: ${{ inputs.release_name }}
      REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download verified macOS package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MACOS_RUN_ID }}
          name: IntelGram-macOS-Apple-Silicon
          path: release-assets

      - name: Download verified Windows package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WINDOWS_RUN_ID }}
          name: IntelGram-Windows-x64
          path: release-assets

      - name: Download verified Linux package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.LINUX_RUN_ID }}
          name: IntelGram-Linux-x64
          path: release-assets

      - name: Publish permanent release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if [[ -n "$REQUESTED_RELEASE_VERSION" ]]; then
            RELEASE_NUMBER="${REQUESTED_RELEASE_VERSION#v}"
          else
            RELEASE_NUMBER="$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq '.[].name' \
                | sed -nE 's/^IntelGram v([0-9]+) - .+$/\1/p' \
                | sort -n \
                | tail -1
            )"
            RELEASE_NUMBER="$(( ${RELEASE_NUMBER:-0} + 1 ))"
          fi
          [[ "$RELEASE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          PRODUCT_VERSION="v$RELEASE_NUMBER"
          if gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[].name' \
              | grep -Eq "^IntelGram ${PRODUCT_VERSION} - "; then
            echo "IntelGram $PRODUCT_VERSION already exists." >&2
            exit 1
          fi
          cp intelgram-local-profile-render-overrides.patch release-assets/
          cp intelgram-local-profile-render-overrides.patch release-assets/ayugram-local-profile-render-overrides.patch
          cp build_intelgram_branding.py release-assets/
          cp validate_intelgram_patch.py release-assets/
          python3 -m zipfile -c release-assets/IntelGram-branding-assets.zip branding/icons generate_intelgram_character_icons.py
          for log in launch-macos.log launch-windows.log launch-windows-error.log launch-linux.log; do
            if [[ -f "release-assets/$log" && ! -s "release-assets/$log" ]]; then
              printf 'IntelGram produced no console output and remained running for the launch smoke-test window.\n' > "release-assets/$log"
            fi
          done
          find release-assets -maxdepth 1 -type f -print -exec ls -lh {} \;
          for required in \
            IntelGram-macOS-Apple-Silicon.dmg \
            IntelGram-macOS-Apple-Silicon.zip \
            IntelGram-Windows-x64.zip \
            IntelGram-Linux-x64.tar.gz \
            IntelGram-macOS-validation.txt \
            IntelGram-Windows-validation.txt \
            IntelGram-Linux-validation.txt; do
            test -s "release-assets/$required"
          done
          mapfile -d '' RELEASE_ASSETS < <(find release-assets -maxdepth 1 -type f ! -empty -print0)
          test "${#RELEASE_ASSETS[@]}" -gt 0
          printf '## IntelGram %s %s\n\n' "$PRODUCT_VERSION" "$RELEASE_NAME" > release-notes.md
          cat >> release-notes.md <<'EOF'

          This release contains launch-tested IntelGram packages for macOS Apple Silicon, Windows x64, and Linux x64.

          ### Main features

          - Universal local full-text search across received messages, links, media metadata, and filenames, with a unified view across signed-in accounts.
          - Chat timelines with jump-to-date, statistics, compact media history, saved moments, and locally observed edit/deletion history.
          - Smart folders, private contact notes with reminders and history, opt-in public identity snapshots, local rules, and anti-spam review.
          - Per-chat local tags, priority, download mode, read reminders, local-only draft preference, and local notification muting.
          - **Appearance & Backgrounds** with visual light/dark theme cards, in-app cloud themes, custom theme import and removal, Telegram's wallpaper gallery, local background images, live preview, tiling and wide-layout controls, and IntelGram icon choices.
          - **Liquid Glass** with cached native or local-image blur, adaptive tint and contrast, wallpaper-colored diffusion, cursor-reactive highlights, moving specular reflections, subtle edge refraction, anti-banding grain, and anti-aliased glass edges.
          - A paced 30 Hz refresh for slow decorative Liquid Glass highlights, with normal scrolling and interaction animations left display-synced independently and optical redraws paused while hidden or inactive.
          - Enhanced Animations with Quick Snap, Smooth Flow, Diabolical, Springy, and the optional high-elasticity Liquid Bounce preset across existing transitions, dialogs, drawers, controls, and navigation.
          - Reduced-motion and power-saving behavior remains authoritative over every added animation.
          - Reliable Telegram disguise mode: click anywhere on the blue IntelGram Desktop version heading three times within 1.2 seconds to switch visible product branding and platform icons to Telegram Desktop while retaining every enabled local render feature; use the same physical-click gesture on the Telegram Desktop drawer footer to restore IntelGram.
          - macOS disguise stability for window activation, `@username` navigation, and reactive local-username refreshes, a full-size rounded-square Telegram Dock icon without a duplicate white tile, and reduced full-window Liquid Glass repaint load.
          - Preferences organized into focused Local Profile, Appearance, Glass & Motion, Navigation, Vault, Automation, Export, Privacy, and Advanced pages.
          - Selected-message and chat/account exports to HTML, PDF, Markdown, JSON, and ZIP, plus AES-256-GCM Frozen Account Backup with permitted cached media.
          - Client-render-only display name, UID, primary and other usernames, anonymous number, bio, and profile photo for your own account.
          - Local profile cloning from an already-loaded peer by UID, including Premium, verified, SCAM, FAKE, DIRECT, emoji-status, organization-verification, and personal-channel presentation.
          - A focused **Profile badges** editor with Automatic clone/real-profile mirroring, manual native primary-badge choices, and optional emoji-status and organization-verification document IDs.
          - A clearly labeled local channel showcase that resolves a public channel read-only and displays it on your own IntelGram profile without claiming server ownership or changing membership and permissions.
          - A dedicated **Local-only channel** workspace with private local text posts, local-file attachments, edit/delete/pin/copy actions, and local title, description, and photo settings.
          - Local channel workspace actions never publish, edit, pin, delete, or forward a Telegram message and never synthesize owner, administrator, member, invite, or permission state.
          - Per-channel **Local ownership** under the native three-dot **IntelGram** submenu.
          - Telegram's native **Broadcast a message...** composer, owner-style Manage actions, and persistent local text broadcasts inside the selected channel's real timeline.
          - The native reaction strip and owner-style Reply, Edit, Pin/Unpin, Copy Text, Copy Post Link, Forward, Delete, and Select controls on every synthetic local broadcast.
          - Persistent local replies, edited text, pinned posts, arbitrary emoji and custom-emoji counts, paid-Star display counts, and client-local post links.
          - Configurable starting and maximum views, incremental view growth, interval timing, six baseline reactions, and paid Stars in the local **Broadcast engagement** editor.
          - Synthetic local forwarding uses a safe copied-text handoff so client-only message IDs never enter Telegram's forwarding API.
          - Local ownership text is intercepted before Telegram's send API; media, files, voice, stickers, inline results, forwards, and scheduled posts are blocked before upload or send paths.
          - No creator/admin flag, channel right, membership state, channel information, Telegram message, view, reaction, Stars payment, pin, or edit is changed by local ownership.
          - A profile username editor matching Telegram's native title, `@username` field, validation row, help copy, spacing, and buttons, backed only by IntelGram's local render setting and no server-side username check or update.
          - A native in-app collectible browser with Telegram's read-only live catalog, exact numbered gifts, native previews and details, and Telegram, Getgems, and TON link input.
          - A visual collection gallery and scrollable exact-item gallery that selects collectibles without leaving IntelGram.
          - A featured local collectible backdrop and up to six pinned local collectibles around your avatar.
          - Local and cloned collectible details present **Gifted to** and the **Telegram** profile chip with your active rendered display name; both open your locally rendered profile card with its local photo, phone, usernames, bio, and personal channel without changing ownership data.
          - Grouped local profile settings, a name-color preview that follows the local display name, and fourteen platform-native app icon choices, including full-bleed macOS artwork without a duplicate white frame.
          - A bundled in-app update log plus IntelGram Telegram, GitHub, product changelog, and technical changelog links.
          - An optional supporter badge after you explicitly join `@intelgrams` through Telegram's normal channel page.

          ### Local-only boundary

          IntelGram does not update your Telegram name, photo, username, UID, phone, bio, emoji status, contacts, collectible ownership, server-side channel ownership, permissions, or membership. Local ownership controls, broadcasts, workspace posts, and settings remain private IntelGram records and are never submitted as Telegram channel actions. Restrict Saving Content and self-destruct rules are preserved: protected message bodies and media never enter the vault, rules, exports, or backups.

          See the [complete feature list](https://github.com/foolspec/IntelGram/blob/main/FEATURES.md), [changelog](https://github.com/foolspec/IntelGram/blob/main/CHANGELOG.md), and [technical changelog](https://github.com/foolspec/IntelGram/blob/main/TECHNICAL_CHANGELOG.md).

          Local profile and collectible override features by **fool**.
          EOF
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "IntelGram $PRODUCT_VERSION - $RELEASE_NAME" \
            --notes-file release-notes.md \
            "${RELEASE_ASSETS[@]}"
