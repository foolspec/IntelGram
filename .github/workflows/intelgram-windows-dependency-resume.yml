name: Resume IntelGram Windows Dependencies

# Resume only the final official dependency stage from a preserved cache.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID containing the resumable final dependency cache
        required: true
        type: string
      source_run_attempt:
        description: Run attempt containing the resumable final dependency cache
        required: true
        default: "1"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  resume:
    name: Resume Windows dependencies 9 of 9
    uses: ./.github/workflows/intelgram-windows-dependency-stage.yml
    with:
      cache_key: intelgram-v6.7.8-windows2022-libraries-final-v2-${{ github.run_id }}-${{ github.run_attempt }}
      restore_key: |
        intelgram-v6.7.8-windows2022-libraries-final-v2-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
      prerequisite_cache_key: intelgram-v6.7.8-windows2022-libraries-final-v2-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
      prerequisite_marker: windows-dependencies-final-libraries.complete
      completion_marker: windows-dependencies-final.complete
      stage_timeout_minutes: 330
      number_of_processors: "1"
